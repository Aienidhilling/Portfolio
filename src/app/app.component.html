<div class="nav-button-container">
  <button mat-icon-button (click)="sidenav.toggle();isClosed = !sidenav.opened" [ngClass]="{'active-button': !isClosed}" >
    <mat-icon>{{ isClosed ? 'menu' : 'close' }}</mat-icon>
  </button>
</div>
<mat-sidenav-container>
  <mat-sidenav #sidenav mode="side" >
    <app-custom-nav [ngClass]="{'visible-nav': !isClosed}" ></app-custom-nav>
  </mat-sidenav>
</mat-sidenav-container>
<div class="options-container">
  <button mat-button>
    <span>FR</span>
  </button>
  <button mat-icon-button>
    <mat-icon>invert_colors</mat-icon>
  </button>
</div>
<router-outlet></router-outlet>
